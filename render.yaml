services:
  - type: web
    name: gen-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: gen-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: gen-api
      - key: JWT_AUDIENCE
        value: gen-clients
      - key: QR_ENCRYPTION_KEY
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      - key: WEB_ORIGIN
        value: https://gen-web.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
  - type: web
    name: gen-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://gen-api-2af9.onrender.com

databases:
  - name: gen-postgres
    databaseName: gen
    user: gen
    plan: free
    postgresMajorVersion: "18"
