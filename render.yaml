services:
  - type: web
    name: gen-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: gen-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: gen-api
      - key: JWT_AUDIENCE
        value: gen-clients
      - key: QR_ENCRYPTION_KEY
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      - key: WEB_ORIGIN
        value: https://gen-web-m47g.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
  - type: web
    name: gen-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://gen-api-2af9.onrender.com
  - type: web
    name: gen-admin-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @admin-finops/backend
    startCommand: npm run prisma:migrate -w @admin-finops/backend && npm run start -w @admin-finops/backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max_old_space_size=512
      - key: DATABASE_URL
        fromDatabase:
          name: gen-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: FRONTEND_URL
        value: https://gen-admin-web.onrender.com
      - key: CORS_ORIGIN
        value: https://gen-admin-web.onrender.com
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SMTP_URL
        sync: false
  - type: web
    name: gen-admin-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w @admin-finops/frontend
    staticPublishPath: apps/admin-web/dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_OPTIONS
        value: --max_old_space_size=512
      - key: VITE_API_URL
        value: https://gen-admin-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: gen-postgres
    databaseName: gen
    user: gen
    plan: free
    postgresMajorVersion: "18"
